; 3B2/700 base machine: 64 MB, SCSI disk, floppy, 8 PORTS lines, NI via SLIRP NAT.
set console -q
load -r 3b2_700.bin
set cpu 64M
set cpu %IDLE%
att nvram nvram.bin
att tod tod.bin
set scsi1 enable
set scsi1 sd630
attach scsi1 %DISK%
set ports enable
set ports lines=8
attach ports 127.0.0.1:9001
; Ethernet: CM195A NI via SLIRP user-mode NAT (guest 10.0.2.15, gw 10.0.2.2, dns 10.0.2.3).
; Host port 2323 -> guest telnet, 2121 -> guest ftp.
set ni enable
attach ni nat:tcp=2323:10.0.2.15:23,tcp=2121:10.0.2.15:21
boot
