set console -q
load -r 3b2_700.bin
set cpu 64M
set cpu idle
att nvram nvram.bin
att tod tod.bin
set scsi1 enable
set scsi1 sd630
attach scsi1 disk0.img
set ports enable
set ports lines=8
attach ports 9001
expect "Console Login:" send "root\r"; continue
expect "# " send "uname -a; cat /etc/motd; df; exit\r"; continue
expect "Console Login:" exit
boot
