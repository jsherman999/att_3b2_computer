[package]
name = "att_dmd"
version = "0.1.0"
edition = "2021"
description = "C ABI wrapper around dmd_core (AT&T DMD 5620 emulator core) for ATT3B2.app"
license = "MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
# Seth Morabito's DMD 5620 core: WE32100 CPU, firmware 8;7;5 ROM, DUART, mouse, video.
dmd_core = { git = "https://github.com/dmdmtg/dmd_core", rev = "d08a593" }
# AT&T 630 MTG core (this repo): exported below as att630_*.
mtg630 = { path = "../mtg630" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Use the local, patched checkout (scripts/fetch-assets.sh clones it into
# vendor/dmd_core at the pinned rev and applies patches/dmd_core-*.patch).
[patch."https://github.com/dmdmtg/dmd_core"]
dmd_core = { path = "../vendor/dmd_core" }
